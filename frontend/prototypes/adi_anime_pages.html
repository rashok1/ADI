<!DOCTYPE html>
<html lang="en">
<head>

<title>Adi — anime pond pages (reference)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
  *{box-sizing:border-box;font-family:'Fredoka',sans-serif;}
  body{background:#EFE9DC;margin:0;padding:24px;color:#3E6B52;}
  h1{text-align:center;font-size:20px;font-weight:700;margin-bottom:16px;}
  .tabs{display:flex;justify-content:center;gap:8px;margin-bottom:18px;}
  .tab-btn{border:2px solid #cfd9c9;background:#fff;border-radius:16px;padding:8px 16px;font-size:13px;font-weight:600;color:#5C7A68;cursor:pointer;}
  .tab-btn.active{background:#FFC9DE;color:#B5507A;border-color:#FFC9DE;}
  .stage{display:flex;justify-content:center;}
  .card{width:400px;border-radius:26px;overflow:hidden;position:relative;box-shadow:0 6px 24px rgba(0,0,0,0.08);}
  .page{display:none;}
  .page.active{display:block;}
  .overlay{position:absolute;left:0;right:0;bottom:0;padding:18px 20px 22px;text-align:center;}
  button.cta{border:none;cursor:pointer;padding:11px 28px;border-radius:20px;font-size:15px;font-weight:600;font-family:'Fredoka',sans-serif;transition:transform .2s cubic-bezier(.68,-0.55,.27,1.55);}
  button.cta:hover{transform:scale(1.05);}
  button.cta:active{transform:scale(0.94);}
  @keyframes twinkle{0%,100%{opacity:.2;transform:scale(0.7);}50%{opacity:1;transform:scale(1.1);}}
  .spark{animation:twinkle 1.6s ease-in-out infinite;}
</style>
</head>

</div></div>

<script>
const btns=document.querySelectorAll('.tab-btn');
const pages=document.querySelectorAll('.page');
function show(name){
  pages.forEach(p=>p.classList.toggle('active', p.id==='p-'+name));
  btns.forEach(b=>b.classList.toggle('active', b.dataset.p===name));
}
btns.forEach(b=>b.addEventListener('click',()=>show(b.dataset.p)));
show('welcome');
</script>
</body>
</html>
